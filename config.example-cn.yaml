# 服务监听的主机/网卡地址。默认空字符串（""）表示绑定所有网卡（IPv4 + IPv6）。
# 使用 "127.0.0.1" 或 "localhost" 可将访问限制在本机。
host: ""

# 服务端口
port: 8317

# HTTPS 的 TLS 设置。启用后，服务将使用提供的证书和私钥监听。
tls:
  enable: false
  cert: ""
  key: ""

# 管理 API 设置
remote-management:
  # 是否允许远程（非 localhost）访问管理接口。
  # 为 false 时，只有 localhost 可以访问管理接口（仍然需要管理密钥）。
  allow-remote: false

  # 管理密钥。如果这里填写的是明文，启动时会自动哈希。
  # 所有管理请求（包括来自 localhost 的请求）都必须携带此密钥。
  # 留空则完全禁用 Management API（所有 /v0/management 路由都会返回 404）。
  secret-key: ""

  # 为 true 时，禁用内置管理面板资源下载和对应的 HTTP 路由。
  disable-control-panel: false

  # 禁用从 GitHub 自动周期性更新管理面板（默认：false）。
  # 启用后，仅在首次访问且本地缺失时下载一次，之后不再自动更新。
  # disable-auto-update-panel: false

  # 管理面板对应的 GitHub 仓库。支持填写仓库 URL 或 releases API URL。
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# 认证目录（支持使用 ~ 表示 home 目录）
auth-dir: "~/.cli-proxy-api"

# 用于下游客户端认证的 API keys
api-keys:
  - "your-api-key-1"
  - "your-api-key-2"
  - "your-api-key-3"

# 是否开启 debug 日志
debug: false

# 是否启用 pprof HTTP 调试服务（host:port）。出于安全考虑，建议仅绑定 localhost。
pprof:
  enable: false
  addr: "127.0.0.1:8316"

# 为 true 时，禁用高开销 HTTP 中间件特性，以降低高并发下的单请求内存占用。
commercial-mode: false

# 为 true 时，将应用日志写入滚动日志文件，而不是 stdout
logging-to-file: false

# logs 目录下日志文件允许的总大小上限（MB）。超过后会删除最旧的日志文件，
# 直到回到限制以内。设为 0 可禁用该限制。
logs-max-total-size-mb: 0

# 当请求日志关闭时，最多保留多少个错误日志文件。
# 超过后会删除最旧的错误日志文件。默认 10，设为 0 可禁用清理。
error-logs-max-files: 10

# 为 false 时，禁用内存中的 usage 统计聚合
usage-statistics-enabled: false

# 代理 URL。支持 socks5/http/https。示例：socks5://user:pass@192.168.1.1:1080/
# 单个条目的 proxy-url 也支持 "direct" 或 "none"，用于显式绕过全局 proxy-url 和环境代理。
proxy-url: ""

# 为 true 时，未带前缀的模型请求只会匹配没有 prefix 的凭据（prefix == model name 的情况除外）。
force-model-prefix: false

# 为 true 时，将过滤后的上游响应头继续转发给下游客户端。
# 默认 false（关闭）。
passthrough-headers: false

# 请求失败后的重试次数。仅当 HTTP 状态码为 403、408、500、502、503、504 时触发重试。
request-retry: 3

# 单次失败请求最多尝试多少个不同凭据。
# 设为 0 表示保留旧行为（尝试所有可用凭据）。
max-retry-credentials: 0

# 在触发重试前，最多等待冷却中的凭据恢复多少秒。
max-retry-interval: 30

# 为 true 时，全局禁用 auth/model 冷却调度（避免失败后进入 blackout 窗口）。
disable-cooling: false

# 核心 auth 自动刷新 worker 池大小（OAuth / 文件型 auth token 刷新）。
# 当值 > 0 时，将覆盖默认 worker 数量（16）。
# auth-auto-refresh-workers: 16

# 配额超限时的行为
quota-exceeded:
  switch-project: true # 配额超限时是否自动切换到其他 project
  switch-preview-model: true # 配额超限时是否自动切换到 preview 模型
  antigravity-credits: true # 当 Claude 免费额度全部耗尽时，是否使用 credits 作为最后兜底

# 多个匹配凭据之间的路由策略
routing:
  strategy: "round-robin" # round-robin（默认）、fill-first
  # 为所有客户端启用通用的会话粘滞路由。
  # Session ID 会从以下位置提取：X-Session-ID header、Idempotency-Key、
  # metadata.user_id、conversation_id，或前几条消息的哈希。
  # 当已绑定 auth 不可用时，始终会自动 failover。
  session-affinity: false # 默认：false
  # session 到 auth 的绑定保留时长。默认：1h
  session-affinity-ttl: "1h"

# 为 true 时，启用 WebSocket API（/v1/ws）的认证。
ws-auth: false

# 为 true 时，启用 Gemini CLI 内部端点（/v1internal:*）。
# 出于安全考虑，默认 false。
enable-gemini-cli-endpoint: false

# 当值 > 0 时，非流式响应每 N 秒发送一个空行，防止空闲超时。
nonstream-keepalive-interval: 0
# 流式响应行为（SSE keep-alive + 安全启动重试）。
# streaming:
#   keepalive-seconds: 15   # 默认：0（关闭）。<= 0 表示禁用 keep-alive。
#   bootstrap-retries: 1    # 默认：0（关闭）。在首字节发送前允许重试次数。

# thinking 块的签名缓存校验（Antigravity/Claude）。
# 为 true（默认）时，优先使用并校验缓存签名。
# 为 false 时，归一化后直接使用客户端签名（适用于测试时绕过）。
# antigravity-signature-cache-enabled: true

# 签名绕过模式下的严格校验设置（仅在禁用签名缓存时生效）。
# 为 true 时，校验完整 Claude protobuf 树结构（Field 2 -> Field 1）。
# 为 false（默认）时，仅检查 R/E 前缀 + base64 + 首字节 0x12。
# antigravity-signature-bypass-strict: false

