# Claude API 请求的默认 header。Claude Code 发布新版本后可按需更新。
# 在 legacy 模式下，当客户端未发送对应 header 时，
# user-agent/package-version/runtime-version/timeout 会作为兜底值，而 OS/arch 仍来自运行时。
# 当启用 stabilize-device-profile 后，OS/arch 会固定为下方基线值，
# user-agent/package-version/runtime-version 则作为软件指纹种子，
# 仍可升级到更新版本的官方 Claude 客户端。
# claude-header-defaults:
#   user-agent: "claude-cli/2.1.44 (external, sdk-cli)"
#   package-version: "0.74.0"
#   runtime-version: "v24.3.0"
#   os: "MacOS"
#   arch: "arm64"
#   timeout: "600"
#   stabilize-device-profile: false  # 可选，默认 false；设为 true 时启用按 auth/API key 固定指纹

# Codex OAuth 模型请求的默认 header。
# 仅在文件型 / OAuth Codex 请求且客户端未发送对应 header 时使用。
# `user-agent` 同时作用于 HTTP 和 websocket 请求；
# `beta-features` 仅作用于 websocket 请求。它们不作用于 codex-api-key 条目。
# codex-header-defaults:
#   user-agent: "codex_cli_rs/0.114.0 (Mac OS 14.2.0; x86_64) vscode/1.111.0"
#   beta-features: "multi_agent"

