# 全局 OAuth 模型名称别名（按 channel 配置）
# 这些别名会同时影响模型列表和请求路由。
# 支持的 channels：gemini-cli、vertex、aistudio、antigravity、claude、codex、kimi。
# 注意：这些别名不会作用于 gemini-api-key、codex-api-key、claude-api-key、openai-compatibility、vertex-api-key 或 ampcode。
# 注意：由于别名会影响合并后的 /v1 模型列表和合并请求路由，不同 provider 间如果出现同名客户端模型，可能造成歧义。
# /api/provider/{provider}/... 可以帮助你选择协议层，但最终推理后端仍可能按解析后的 model/alias 继续路由。
# 如果需要严格固定后端，请使用唯一的 alias / prefix，或避免名称重叠。
# 你可以对同一个 name 配置多个 alias，以暴露多个客户端模型名。
