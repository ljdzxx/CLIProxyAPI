#   gemini-cli:
#     - name: "gemini-2.5-pro"          # 该 channel 下的原始模型名
#       alias: "g2.5p"                  # 客户端可见别名
#       fork: true                      # 为 true 时，保留原模型名并额外增加 alias 作为新模型（默认：false）
